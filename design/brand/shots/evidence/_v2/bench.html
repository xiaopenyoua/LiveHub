<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:InterVar;src:url("file:///Volumes/ssd/projects-github/LiveHub/assets/fonts/InterVariable.woff2") format('woff2');font-weight:100 900;font-style:normal}
html,body{margin:0;background:#000;color:#ccc;font:11px -apple-system,"PingFang SC",sans-serif}
.tile{position:absolute;width:48px;height:48px;overflow:hidden;background:#231c16}
svg{display:block}
.t{font-family:InterVar;font-weight:600;font-variation-settings:'opsz' 32;font-optical-sizing:none;letter-spacing:-0.02em}
span.m{position:absolute;left:-9999px;top:0;font-family:InterVar;font-weight:600;font-size:100px;
  line-height:1;letter-spacing:-0.02em;white-space:pre;font-optical-sizing:none}
.m32{font-variation-settings:'opsz' 32}.m14{font-variation-settings:'opsz' 14}</style></head><body>
<span class="m m32" id="m-livehub">LiveHub</span>
<span class="m m32" id="m-live">Live</span>
<span class="m m32" id="m-hub">Hub</span>
<span class="m m32" id="m-lh">LH</span>
<span class="m m32" id="m-l">L</span>
<span class="m m32" id="m-h">H</span>
<span class="m m14" id="m-livehub14">LiveHub</span>
<div class="tile" id="A-white" style="left:10px;top:10px"><svg width="48" height="48"><text class="t" data-tile="A-white" x="0" y="0" font-size="10.3900" fill="#fffdfa">LiveHub</text></svg></div><div class="tile" id="A-2color" style="left:68px;top:10px"><svg width="48" height="48"><text class="t" data-tile="A-2color" data-part="live" x="0" y="0" font-size="10.3900" fill="#fffdfa">Live</text><text class="t" data-tile="A-2color" data-part="hub" x="0" y="0" font-size="10.3900" fill="#ff453a">Hub</text></svg></div><div class="tile" id="B19-white" style="left:126px;top:10px"><svg width="48" height="48"><text class="t" data-tile="B19-white" x="0" y="0" font-size="15.1327" fill="#fffdfa">LH</text></svg></div><div class="tile" id="B20-white" style="left:184px;top:10px"><svg width="48" height="48"><text class="t" data-tile="B20-white" x="0" y="0" font-size="16.2192" fill="#fffdfa">LH</text></svg></div><div class="tile" id="B29-white" style="left:10px;top:68px"><svg width="48" height="48"><text class="t" data-tile="B29-white" x="0" y="0" font-size="23.0948" fill="#fffdfa">LH</text></svg></div><div class="tile" id="B29-2color" style="left:68px;top:68px"><svg width="48" height="48"><text class="t" data-tile="B29-2color" data-part="live" x="0" y="0" font-size="23.0948" fill="#fffdfa">Live</text><text class="t" data-tile="B29-2color" data-part="hub" x="0" y="0" font-size="23.0948" fill="#ff453a">Hub</text></svg></div><div class="tile" id="CTL-wrong-red" style="left:126px;top:68px"><svg width="48" height="48"><text class="t" data-tile="CTL-wrong-red" data-part="live" x="0" y="0" font-size="10.3900" fill="#fffdfa">Live</text><text class="t" data-tile="CTL-wrong-red" data-part="hub" x="0" y="0" font-size="10.3900" fill="#E03127">Hub</text></svg></div><div class="tile" id="CTL-grey-stroke" style="left:184px;top:68px"><svg width="48" height="48"><text class="t" data-tile="CTL-grey-stroke" data-part="live" x="0" y="0" font-size="10.3900" fill="#fffdfa" stroke="#808080" stroke-width="0.6">Live</text><text class="t" data-tile="CTL-grey-stroke" data-part="hub" x="0" y="0" font-size="10.3900" fill="#ff453a" stroke="#808080" stroke-width="0.6">Hub</text></svg></div>
<script>
const TILES = [{"id":"A-white","kind":"leg","em":10.39,"base":27.78,"text":"LiveHub"},{"id":"A-2color","kind":"two","em":10.39,"base":27.78},{"id":"B19-white","kind":"leg","em":15.132702157380102,"base":null,"text":"LH"},{"id":"B20-white","kind":"leg","em":16.219152568679185,"base":null,"text":"LH"},{"id":"B29-white","kind":"leg","em":23.09483160018625,"base":null,"text":"LH"},{"id":"B29-2color","kind":"two","em":23.09483160018625},{"id":"CTL-wrong-red","kind":"ctl-red","em":10.39},{"id":"CTL-grey-stroke","kind":"ctl-grey","em":10.39}];
const CAP = 0.72754;
window.__fontOk = null; window.__placed = null; window.__err = null; window.__status = null;
function placeNow() {
  if (window.__placed) return;
  window.__fontOk = document.fonts.check('600 48px InterVar');
  window.__status = document.fonts.status;
  const W = id => document.getElementById(id).getBoundingClientRect().width / 100;   // em
  const adv = { livehub: W('m-livehub'), live: W('m-live'), hub: W('m-hub'), lh: W('m-lh'), L: W('m-l'), H: W('m-h'), livehub14: W('m-livehub14') };
  const place = {};
  for (const t of TILES) {
    const nodes = document.querySelectorAll('[data-tile="' + t.id + '"]');
    const base = (typeof t.base === 'number') ? t.base : (48 + CAP * t.em) / 2;
    let x;
    if (t.kind === 'leg') x = (48 - adv[t.text === 'LH' ? 'lh' : 'livehub'] * t.em) / 2;
    else x = (48 - adv.livehub * t.em) / 2;
    for (const n of nodes) {
      n.setAttribute('y', base.toFixed(3));
      // 连续字符串：Live 的 advance 减掉尾部那一个字距，不在元素边界凭空多一道缝
      if (t.kind !== 'leg' && n.dataset.part === 'hub') n.setAttribute('x', (x + (adv.live - 0.02) * t.em).toFixed(3));
      else n.setAttribute('x', x.toFixed(3));
    }
    place[t.id] = { base: +base.toFixed(3), x: +x.toFixed(3) };
  }
  window.__place = place; window.__adv = adv; window.__placed = 1;
}
document.fonts.ready.then(() => { try { placeNow(); } catch (e) { window.__err = String(e); } });
setTimeout(() => { try { placeNow(); window.__fallback = 1; } catch (e) { window.__err = String(e); } }, 600);
</script></body></html>
